<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Basic&family=Dancing+Script:wght@400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="main">
        <h2>Calcu<span style="color: red;">lator</span></h2>
        <div class="input-div">
            <input type="text" id="input">
        </div>
        <div class="buttons">
            <div class="rows">
                <button>AC</button>
                <button>DE</button>
                <button class="operatorBtn">%</button>
                <button class="operatorBtn">/</button>
            </div>
            <div class="rows">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operatorBtn">*</button>
            </div>
            <div class="rows">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operatorBtn">-</button>
            </div>
            <div class="rows">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operatorBtn">+</button>
            </div>
            <div class="rows">
                <button>0</button>
                <button>00</button>
                <button class="dotBtn">.</button>
                <button class="equalBtn">=</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
