<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
         <div class="card-header">
            <span class="badge">Active Session</span>
        </div>
        <div class="card-body">
            <div class="avatar">
                <span class="avatar-text">U</span>
            </div>
            <h2>Dashboard</h2>
            <p class="welcome-text">Welcome 👋🏻<span id="userName" class="user-highlight"></span></p>
            <p class="status-text">You are successfully logged in and fully authenticated.</p>
        </div>
         <div class="card-footer">
            <button class="btn btn-logout" id="logoutBtn">
                <span>Logout➜</span>
            </button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
